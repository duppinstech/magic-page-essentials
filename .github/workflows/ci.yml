name: CI

on:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: Release notes for the current version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' magic-page-essentials.php | tr -d '\r')
          bash bin/release-notes.sh "$version" magic-page-essentials.php "$RUNNER_TEMP/release-notes.md"
